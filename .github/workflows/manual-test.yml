name: Manual Test

# checkov:skip=CKV_GHA_7:Manual test workflow intentionally allows selecting the scanner version.
on:
  workflow_dispatch:
    inputs:
      scanner-version:
        description: 'Version of the scanner to use'
        required: false

permissions:
  contents: read

jobs:
  test-typescript:
    name: Manual test setup scanner
    runs-on: ubuntu-latest

    steps:
      # Init
      - name: 'Init: Checkout code'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./
        with:
          version: ${{ inputs.scanner-version || 'latest' }}

      - name: 'SonarQube: Scan'
        run: sonar-scanner --version
